<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Raj Aghara</title>
  <link rel="stylesheet" href="./animations/gsap-webflow-offbrand.webflow.shared.1d2cc8aa4.min.css">
  <style>
    :root {
      --bg: #ffe9cf;
      --primary: #270f03;
      --accent: #ffe600;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .resume-card {
      background: #ffffff;
      border: 3.5px solid #000000;
      box-shadow: 8px 8px 0px #000000;
      padding: 3rem 4rem;
      max-width: 680px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background: #0d0d0d;
      color: var(--accent);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.4rem 1.2rem;
      border: 2px solid #000000;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }
    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #555555;
      margin-bottom: 2rem;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #000000;
      font-weight: 800;
      text-decoration: none;
      padding: 0.8rem 1.8rem;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .btn-back:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }
  </style>
</head>
<body>
  <div class="resume-card">
    <div class="badge">Curriculum Vitae</div>
    <h1>Raj Aghara</h1>
    <p style="font-size: 1.15rem; line-height: 1.6; color: #333333; margin-bottom: 1.5rem;">
      <strong>Full Stack Developer • AI & ML Enthusiast • DSA</strong><br>
      B.Tech in Computer Science & Engineering — <strong>Darshan University, Rajkot</strong><br><br>
      Status: <span style="background: #10CD00; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: 700;">FREELANCE AVAILABLE</span><br>
      Email: <a href="mailto:raj.aghara2007@gmail.com" style="color: #000; font-weight: 700; text-decoration: underline;">raj.aghara2007@gmail.com</a>
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem;">
      <a href="https://github.com/rajaghara2007" target="_blank" rel="noopener noreferrer" class="btn-back" style="background: #000000; color: #ffffff;">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/raj-aghara" target="_blank" rel="noopener noreferrer" class="btn-back" style="background: #0A66C2; color: #ffffff; border-color: #0A66C2;">LinkedIn ↗</a>
    </div>
    <a href="index.html" class="btn-back">← Back to Portfolio</a>
  </div>
</body>
</html>
